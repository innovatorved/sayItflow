name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to publish (e.g. v1.3.0). Will be created if it does not exist."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build macOS DMG
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Tests
        run: |
          cd apps/macos
          xcodebuild test \
            -scheme SayItFlow \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build DMG
        run: |
          chmod +x scripts/make-dmg.sh
          ./scripts/make-dmg.sh

      - name: Verify DMG & Generate SHA-256
        run: |
          shasum -a 256 build/SayItFlow.dmg > build/SayItFlow.dmg.sha256
          cat build/SayItFlow.dmg.sha256

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            build/SayItFlow.dmg
            build/SayItFlow.dmg.sha256
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: release-assets

      - name: List release assets
        run: ls -lh release-assets/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: SayItFlow ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: false
          make_latest: "true"
          generate_release_notes: true
          files: |
            release-assets/SayItFlow.dmg
            release-assets/SayItFlow.dmg.sha256

  sync-homebrew:
    name: Sync Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: release-assets

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Clone Homebrew tap and sync cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN not set — skipping Homebrew tap push."
            exit 0
          fi

          TAG="${{ needs.release.outputs.tag || github.ref_name }}"
          TAP_DIR="$RUNNER_TEMP/homebrew-tap"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/innovatorved/homebrew-tap.git" "$TAP_DIR"

          TAP_DIR="$TAP_DIR" \
          DMG_PATH="$GITHUB_WORKSPACE/release-assets/SayItFlow.dmg" \
          RELEASE_TAG="$TAG" \
            node scripts/sync-cask.js

          cd "$TAP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/sayitflow.rb

          if git diff --cached --quiet; then
            echo "No changes to commit in homebrew-tap."
            exit 0
          fi

          git commit -m "sayitflow: bump cask for ${TAG}"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              echo "Successfully pushed cask update to homebrew-tap!"
              exit 0
            fi
            sleep $((i * 3))
          done

          echo "git push failed after retries in homebrew-tap"
          exit 1
