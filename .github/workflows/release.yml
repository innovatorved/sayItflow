name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to publish (e.g. v1.3.0). Will be created if it does not exist."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, Release & Sync Homebrew
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select latest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app /Applications/Xcode.app 2>/dev/null | sort -V | tail -1)
          if [[ -n "$latest" ]]; then
            echo "Selecting $latest"
            sudo xcode-select -s "$latest/Contents/Developer"
          fi
          echo "Active SDK: $(xcrun --show-sdk-version)"
          echo "Swift: $(swift --version 2>&1 | head -1)"

      - name: Run Tests
        run: |
          cd apps/macos
          xcodebuild test \
            -scheme SayItFlow \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build DMG
        run: |
          chmod +x scripts/make-dmg.sh
          ./scripts/make-dmg.sh

      - name: Verify DMG & Generate SHA-256
        run: |
          shasum -a 256 build/SayItFlow.dmg > build/SayItFlow.dmg.sha256
          cat build/SayItFlow.dmg.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "Publishing release for $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/SayItFlow.dmg build/SayItFlow.dmg.sha256 --clobber
          else
            gh release create "$TAG" build/SayItFlow.dmg build/SayItFlow.dmg.sha256 \
              --title "SayItFlow $TAG" \
              --generate-notes
          fi

      - name: Sync Homebrew Tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN not set — skipping Homebrew tap push."
            exit 0
          fi

          TAG="${{ inputs.tag || github.ref_name }}"
          TAP_DIR="$RUNNER_TEMP/homebrew-tap"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/innovatorved/homebrew-tap.git" "$TAP_DIR"

          TAP_DIR="$TAP_DIR" \
          DMG_PATH="build/SayItFlow.dmg" \
          RELEASE_TAG="$TAG" \
            node scripts/sync-cask.js

          cd "$TAP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/sayitflow.rb

          if git diff --cached --quiet; then
            echo "No changes to commit in homebrew-tap."
            exit 0
          fi

          git commit -m "sayitflow: bump cask for ${TAG}"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              echo "Successfully pushed cask update to homebrew-tap!"
              exit 0
            fi
            sleep $((i * 3))
          done

          echo "git push failed after retries in homebrew-tap"
          exit 1
